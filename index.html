<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mandala Planner</title>
<style>
:root{--bg:#f6f5f1;--sf:#fff;--tx:#1d1d1b;--mt:#6b6a65;--bd:#d6d3c8;--ac:#3b5bdb;--al:92%;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16161a;--sf:#222227;--tx:#ecebe6;--mt:#9a9993;--bd:#3a3a41;--ac:#5c7cfa;--al:24%;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#16161a;--sf:#222227;--tx:#ecebe6;--mt:#9a9993;--bd:#3a3a41;--ac:#5c7cfa;--al:24%;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:940px;margin:0 auto;padding:10px 10px 0}
button{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:6px 11px;cursor:pointer}
button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.title{width:100%;font:700 1.35rem/1.2 inherit;font-family:inherit;color:var(--tx);background:transparent;border:0;border-bottom:2px dashed var(--bd);padding:4px 2px;margin-bottom:8px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.seg{display:flex}.seg button:first-child{border-radius:8px 0 0 8px}.seg button:last-child{border-radius:0 8px 8px 0;margin-left:-1px}
.zoom{display:flex;gap:6px;align-items:center;color:var(--mt)}
.prog{height:8px;background:var(--bd);border-radius:6px;overflow:hidden}#pb{height:100%;width:0;background:#2f9e44;transition:width .3s}
#pt{font-size:.85rem;color:var(--mt)}
#wrap{overflow:auto;margin:8px auto;border-radius:8px}
#grid{container-type:inline-size;width:calc(var(--z,1)*100%);display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
#grid.m8{grid-template-columns:1fr;max-width:560px;margin:0 auto}
.blk{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.c{position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:3px;border-radius:4px;border:1px solid var(--bd);overflow:hidden;cursor:pointer;line-height:1.15;overflow-wrap:anywhere;font-size:clamp(6px,1.35cqw,14px);background:var(--sf);-webkit-tap-highlight-color:transparent}
.m8 .c{font-size:clamp(12px,4.2cqw,24px);padding:8px;border-radius:10px}
.c.main{background:var(--tx);color:var(--bg);font-weight:700}
.c.goal{background:hsl(var(--h) 55% 42%);color:#fff;font-weight:600}
.c.action{background:hsl(var(--h) 60% var(--al));color:var(--tx)}
.t{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.t:empty::before{content:attr(data-ph);opacity:.5}
.c.sel{outline:3px solid var(--ac);outline-offset:-3px;z-index:1}
.done .t{text-decoration:line-through;opacity:.6}
.done::after{content:"✓";position:absolute;top:1px;right:3px;font-weight:800}
.pg{position:absolute;left:0;bottom:0;height:3px;background:rgba(255,255,255,.9)}
#ed{position:sticky;bottom:0;background:var(--sf);border:1px solid var(--bd);border-radius:12px 12px 0 0;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));margin-top:10px;box-shadow:0 -4px 14px rgba(0,0,0,.1)}
textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px;resize:vertical;margin:6px 0}
.sw{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.sw i{width:26px;height:26px;border-radius:50%;border:2px solid var(--bd);cursor:pointer}
.sw input{width:34px;height:30px;padding:0;border:0;background:none}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#bk{margin-top:10px}#bk textarea{min-height:90px;font:12px monospace}
.mt{color:var(--mt);font-size:.85rem}
.app{display:flex;max-width:1240px;margin:0 auto}
main{flex:1;min-width:0}
#side{width:240px;flex:none;border-right:1px solid var(--bd);padding:12px 10px;position:sticky;top:0;align-self:flex-start;max-height:100vh;overflow:auto}
.sh{margin-bottom:8px}
.lib{display:flex;flex-wrap:wrap;gap:6px}
.lib button{padding:5px 9px;font-size:.85rem}
#fl{list-style:none;margin:0 0 12px;padding:0}
#fl li{display:flex;align-items:center;gap:6px;padding:8px 9px;border-radius:8px;cursor:pointer;border:1px solid transparent}
#fl li:hover{background:var(--sf)}
#fl li.on{background:var(--sf);border-color:var(--ac);font-weight:600}
#fl li span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#fl small{color:var(--mt);font-size:.75rem;font-weight:400}
#tg{display:none}
@media(max-width:760px){.app{display:block}#side{display:none;width:auto;position:static;max-height:none;border:0;border-bottom:1px solid var(--bd)}#side.open{display:block}#tg{display:inline-block}}
@media print{.bar,#side,#ed,#bk{display:none}}
</style></head><body>
<div class="app"><aside id="side"><div class="sh"><b>My charts</b></div><ul id="fl"></ul><div class="lib"><button id="new">＋ New</button><button id="dup" title="Copy this chart as a fresh starting point (checkmarks cleared)">Duplicate</button><button id="del">Delete</button></div>
</aside><main>
<input id="title" class="title" maxlength="60" aria-label="Chart title">
<div class="bar">
<button id="tg">☰ Charts</button>
<div class="seg"><button data-m="8">8 goals</button><button data-m="64">64 goals</button></div>
<label class="zoom" id="zl">Zoom <input id="zoom" type="range" min="100" max="300" step="10"></label>
<button id="th" title="Light / dark">🌓</button>
<button id="bkb">Backup</button>
<button id="smp">Sample</button>
<button id="rst">Clear chart</button>
</div>
<div class="prog"><div id="pb"></div></div><span id="pt"></span>
<div id="wrap"><div id="grid"></div></div>
<section id="bk" hidden>
<div class="mt">Copy this text to back up all your charts or move them to another device. Paste a backup here and press Load to add its charts to this list.</div>
<textarea id="bkt" spellcheck="false"></textarea>
<div class="row"><button id="cp">Copy</button><button id="ld">Load</button><span id="msg" class="mt"></span></div>
</section>
<section id="ed">
<b id="edl">Tap any cell to edit it</b>
<div id="edb" hidden>
<textarea id="tx" rows="2" maxlength="200" placeholder="Type here…"></textarea>
<div class="sw" id="sw"><input type="color" id="cc" title="Custom color"></div>
<div class="row">
<label id="dnl"><input type="checkbox" id="dn"> Done</label>
<button id="blk">Apply color to block</button>
<button id="rc">Reset color</button>
<button id="clr">Clear cell</button>
</div>
</div>
</section>
</main></div>
<script>
const $=s=>document.querySelector(s),H=[215,262,330,8,32,145,175,195],MAP=[0,1,2,3,5,6,7,8],KEY='mandala-planner-v1';
const COL=['#e03131','#f76707','#f59f00','#94d82d','#2f9e44','#12b886','#15aabf','#228be6','#4263eb','#7048e8','#ae3ec9','#e64980','#868e96','#212529'];
const HEX=/^#[0-9a-f]{6}$/i;
const KEY2='mandala-planner-v2',uid=()=>Math.random().toString(36).slice(2,9);
let LIB={cur:'',order:[],ch:{},theme:''},S,sel=null;
try{const r=localStorage.getItem(KEY2);if(r){const o=JSON.parse(r);LIB.theme=o.theme=='dark'||o.theme=='light'?o.theme:'';for(const id of o.order||[])if(o.ch&&o.ch[id]){LIB.ch[id]=fix(o.ch[id]);LIB.order.push(id)}LIB.cur=o.cur}
else{const r1=localStorage.getItem(KEY);if(r1){const id=uid();LIB.ch[id]=fix(JSON.parse(r1));LIB.order=[id];LIB.cur=id}}}catch(e){}
if(!LIB.ch[LIB.cur]){if(!LIB.order.length){const id=uid();LIB.ch[id]=fix({});LIB.order=[id]}LIB.cur=LIB.order[0]}
S=LIB.ch[LIB.cur];
function fix(o){const n={title:String(o.title||'My Mandala Plan').slice(0,60),mode:o.mode==8?8:64,zoom:Math.min(3,Math.max(1,+o.zoom||1)),theme:o.theme=='dark'||o.theme=='light'?o.theme:'',t:{},c:{},d:{}};
for(const k in o.t||{})if(/^(m|g[0-7]|a[0-7]_[0-7])$/.test(k))n.t[k]=String(o.t[k]).slice(0,200);
for(const k in o.c||{})if(/^(m|g[0-7]|a[0-7]_[0-7])$/.test(k)&&HEX.test(o.c[k]))n.c[k]=o.c[k];
for(const k in o.d||{})if(/^(g[0-7]|a[0-7]_[0-7])$/.test(k)&&o.d[k])n.d[k]=1;return n}
const save=()=>{try{localStorage.setItem(KEY2,JSON.stringify(LIB))}catch(e){}};
const flash=m=>{$('#msg').textContent=m;setTimeout(()=>$('#msg').textContent='',2500)};
const ink=h=>{const n=parseInt(h.slice(1),16);return((n>>16)*299+(n>>8&255)*587+(n&255)*114)/1000>150?'#1d1d1b':'#fff'};
const range=n=>[...Array(n).keys()];
function cellsOf(p){return range(9).map(q=>{
 if(p==4)return q==4?{k:'m',role:'main'}:{k:'g'+MAP.indexOf(q),role:'goal',gi:MAP.indexOf(q)};
 const gi=MAP.indexOf(p);
 return q==4?{k:'g'+gi,role:'goal',gi,ctr:1}:{k:`a${gi}_${MAP.indexOf(q)}`,role:'action',gi}})}
function cell(o){
 const d=document.createElement('div'),k=o.k;
 d.className='c '+o.role+(S.d[k]?' done':'')+(k==sel?' sel':'');d.dataset.k=k;
 if(o.gi!=null)d.style.setProperty('--h',H[o.gi]);
 if(S.c[k]){d.style.background=S.c[k];d.style.color=ink(S.c[k])}
 const t=document.createElement('span');t.className='t';t.textContent=S.t[k]||'';
 t.dataset.ph=o.role=='main'?'Main goal':o.role=='goal'?'Goal '+(o.gi+1):'Action';d.append(t);
 if(S.mode==64&&o.role=='goal'&&!o.ctr){const n=range(8).filter(j=>S.d[`a${o.gi}_${j}`]).length;
  if(n){const b=document.createElement('i');b.className='pg';b.style.width=n/8*100+'%';d.append(b)}}
 return d}
function render(){
 const g=$('#grid');g.innerHTML='';g.className='m'+S.mode;g.style.setProperty('--z',S.mode==64?S.zoom:1);
 for(let p=0;p<9;p++){if(S.mode==8&&p!=4)continue;const b=document.createElement('div');b.className='blk';cellsOf(p).forEach(o=>b.append(cell(o)));g.append(b)}
 const ks=S.mode==8?range(8).map(i=>'g'+i):range(8).flatMap(i=>range(8).map(j=>`a${i}_${j}`));
 const n=ks.filter(k=>S.d[k]).length,pc=Math.round(n/ks.length*100);
 $('#pb').style.width=pc+'%';$('#pt').textContent=`${n}/${ks.length} done · ${pc}%`;
 document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',+b.dataset.m==S.mode));
 $('#zl').hidden=S.mode==8;$('#zoom').value=S.zoom*100;lib()}
function openEd(){
 $('#edb').hidden=!sel;
 if(!sel){$('#edl').textContent='Tap any cell to edit it';return}
 $('#edl').textContent=sel=='m'?'Main goal':sel[0]=='g'?'Goal '+(+sel.slice(1)+1):`Goal ${+sel[1]+1} · action ${+sel.split('_')[1]+1}`;
 $('#tx').value=S.t[sel]||'';$('#dn').checked=!!S.d[sel];$('#dnl').hidden=sel=='m';
 $('#cc').value=S.c[sel]||'#3b5bdb';
 $('#blk').hidden=S.mode==8&&sel!='m';$('#blk').textContent=sel=='m'?'Apply color to all goals':'Apply color to whole block';
 if(matchMedia('(hover:hover)').matches)$('#tx').focus({preventScroll:true})}
function setColor(h){if(!sel)return;h?S.c[sel]=h:delete S.c[sel];save();render()}
$('#grid').onclick=e=>{const c=e.target.closest('.c');if(!c)return;sel=c.dataset.k;render();openEd()};
$('#tx').oninput=e=>{const v=e.target.value;v?S.t[sel]=v:delete S.t[sel];save();render()};
$('#dn').onchange=e=>{e.target.checked?S.d[sel]=1:delete S.d[sel];save();render()};
$('#cc').oninput=e=>setColor(e.target.value);
$('#rc').onclick=()=>setColor(null);
$('#clr').onclick=()=>{delete S.t[sel];delete S.d[sel];save();render();openEd()};
$('#blk').onclick=()=>{if(!sel)return;const col=S.c[sel],gi=sel=='m'?-1:sel[0]=='g'?+sel.slice(1):+sel[1];
 const ks=gi<0?range(8).map(i=>'g'+i):['g'+gi,...range(8).map(j=>`a${gi}_${j}`)];
 ks.forEach(k=>col?S.c[k]=col:delete S.c[k]);save();render()};
COL.forEach(c=>{const i=document.createElement('i');i.style.background=c;i.title=c;i.onclick=()=>setColor(c);$('#sw').insertBefore(i,$('#cc'))});
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{S.mode=+b.dataset.m;save();render();openEd()});
$('#zoom').oninput=e=>{S.zoom=e.target.value/100;save();render()};
$('#title').oninput=e=>{S.title=e.target.value;save();lib()};
function theme(){document.documentElement.dataset.theme=LIB.theme||''}
$('#th').onclick=()=>{const dark=LIB.theme?LIB.theme=='dark':matchMedia('(prefers-color-scheme:dark)').matches;LIB.theme=dark?'light':'dark';save();theme()};
$('#bkb').onclick=()=>{const b=$('#bk');b.hidden=!b.hidden;if(!b.hidden)$('#bkt').value=JSON.stringify(LIB)};
$('#cp').onclick=async()=>{const t=$('#bkt');try{await navigator.clipboard.writeText(t.value);flash('Copied')}catch(e){t.select();flash(document.execCommand('copy')?'Copied':'Select and copy manually')}};
$('#ld').onclick=()=>{try{const o=JSON.parse($('#bkt').value);if(!o||typeof o!='object')throw 0;
 const list=o.ch?(o.order||[]).map(i=>o.ch[i]).filter(Boolean):[o];if(!list.length)throw 0;
 list.forEach(c=>{const id=uid();LIB.ch[id]=fix(c);LIB.order.push(id);LIB.cur=id});
 S=LIB.ch[LIB.cur];sel=null;save();init();flash('Added '+list.length+' chart(s)')}catch(e){flash('That text isn’t a valid backup')}};
$('#smp').onclick=()=>{const g=['Health','Focus','Learning','Career','Money','People','Home','Fun'],a=[['Sleep 8h','Walk daily','Gym 3×','Eat greens','Drink water','Stretch','Check-ups','Meditate'],['Plan the day','No phone AM','Deep work 2h','Inbox 2×/day','Weekly review','Batch tasks','Single-task','Clear desk']];
 S.t={m:'Level up my productivity'};g.forEach((x,i)=>S.t['g'+i]=x);a.forEach((r,i)=>r.forEach((x,j)=>S.t[`a${i}_${j}`]=x));S.d={a0_0:1,a0_1:1,a1_0:1};save();render();openEd()};
function pcOf(c){const ks=c.mode==8?range(8).map(i=>'g'+i):range(8).flatMap(i=>range(8).map(j=>`a${i}_${j}`));return Math.round(ks.filter(k=>c.d[k]).length/ks.length*100)}
function lib(){const u=$('#fl');u.innerHTML='';LIB.order.forEach(id=>{const c=LIB.ch[id],li=document.createElement('li');li.className=id==LIB.cur?'on':'';li.dataset.id=id;li.tabIndex=0;
 const s=document.createElement('span'),m=document.createElement('small');s.textContent=c.title||'Untitled';m.textContent=c.mode+' · '+pcOf(c)+'%';li.append(s,m);u.append(li)})}
function go(id){LIB.cur=id;S=LIB.ch[id];sel=null;save();init()}
function add(c){const id=uid();LIB.ch[id]=c;LIB.order.push(id);go(id)}
$('#fl').onclick=e=>{const li=e.target.closest('li');if(!li)return;go(li.dataset.id);$('#side').classList.remove('open')};
$('#fl').onkeydown=e=>{if(e.key=='Enter'&&e.target.tagName=='LI')e.target.click()};
$('#tg').onclick=()=>$('#side').classList.toggle('open');
$('#new').onclick=()=>{const c=fix({});c.title='New chart '+(LIB.order.length+1);add(c)};
$('#dup').onclick=()=>{const c=fix(JSON.parse(JSON.stringify(S)));c.d={};c.title=(S.title||'Chart')+' (copy)';add(c)};
let rt,dt;$('#rst').onclick=e=>{if(!rt){e.target.textContent='Sure? Click again';rt=setTimeout(()=>{rt=0;e.target.textContent='Clear chart'},3000);return}
 clearTimeout(rt);rt=0;e.target.textContent='Clear chart';const t=S.title;LIB.ch[LIB.cur]=S=fix({});S.title=t;sel=null;save();init()};
$('#del').onclick=e=>{if(!dt){e.target.textContent='Sure?';dt=setTimeout(()=>{dt=0;e.target.textContent='Delete'},3000);return}
 clearTimeout(dt);dt=0;e.target.textContent='Delete';delete LIB.ch[LIB.cur];LIB.order=LIB.order.filter(i=>i!=LIB.cur);
 if(!LIB.order.length){const id=uid();LIB.ch[id]=fix({});LIB.order=[id]}go(LIB.order[0])};
function init(){theme();lib();$('#title').value=S.title;render();openEd()}
init();
</script></body></html>
